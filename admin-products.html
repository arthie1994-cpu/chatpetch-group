<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHATPHETCH GROUP — จัดการสินค้า</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --black:#050505;
  --dark:#0d0d0d;
  --dark2:#111;
  --gold:#c8a45b;
  --gold-light:#f0d991;
  --line:rgba(255,255,255,.09);
  --gold-line:rgba(200,164,91,.30);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;

  color:#fff;

  font-family:"Prompt","Kanit",sans-serif;

  background:
    radial-gradient(circle at 12% 12%,rgba(200,164,91,.075),transparent 28%),
    radial-gradient(circle at 88% 20%,rgba(200,164,91,.055),transparent 28%),
    #050505;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);

  background-size:40px 40px;

  z-index:0;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:100px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 4vw;

  background:rgba(5,5,5,.95);

  border-top:1px solid rgba(200,164,91,.35);
  border-bottom:1px solid var(--line);

  backdrop-filter:blur(18px);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:52px;
  height:52px;

  border:1px solid var(--gold);

  object-fit:contain;
}

.brand-name{
  font-size:18px;
  font-weight:700;
}

.brand-sub{
  color:#777;
  font-size:11px;
  letter-spacing:2px;
}

.nav{
  display:flex;
  gap:7px;
  align-items:center;
}

.nav a,
.logout{
  min-height:40px;
  padding:0 15px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#aaa;
  text-decoration:none;

  border:1px solid rgba(255,255,255,.08);

  background:#090909;

  font-family:inherit;
  font-size:13px;

  cursor:pointer;
}

.nav a:hover,
.nav a.active,
.logout:hover{
  color:var(--gold-light);
  border-color:var(--gold-line);
}

.user{
  color:#777;
  font-size:12px;
}

.page{
  position:relative;
  z-index:1;

  width:min(
    calc(100% - 48px),
    1540px
  );

  margin:auto;

  padding:55px 0 80px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  margin-bottom:35px;
}

.kicker{
  color:var(--gold);
  font-size:13px;
  letter-spacing:4px;
  font-weight:600;
}

h1{
  margin:7px 0 0;

  font-size:clamp(42px,5vw,60px);
  line-height:1.2;
}

.desc{
  margin-top:10px;
  color:#777;
  font-size:14px;
}

.actions{
  display:flex;
  gap:9px;
}

.btn{
  min-height:44px;
  padding:0 18px;

  border:1px solid rgba(255,255,255,.11);

  background:#101010;

  color:#ddd;

  font-family:inherit;
  cursor:pointer;
}

.btn:hover{
  color:var(--gold-light);
  border-color:var(--gold-line);
}

.gold{
  color:var(--gold-light);
  border-color:var(--gold-line);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:24px;
}

.stat{
  padding:25px 22px;

  border:1px solid var(--line);

  background:rgba(255,255,255,.025);
}

.stat small{
  color:#777;
}

.stat strong{
  display:block;
  margin-top:14px;

  color:var(--gold-light);

  font-size:32px;
}

.toolbar{
  padding:15px;

  display:flex;
  gap:12px;

  border:1px solid var(--line);

  margin-bottom:24px;
}

input,
select{
  height:46px;

  border:1px solid rgba(255,255,255,.10);

  background:#090909;

  color:#ddd;

  font-family:inherit;

  padding:0 14px;

  outline:none;
}

input{
  flex:1;
}

select{
  min-width:210px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  overflow:hidden;

  border:1px solid var(--line);

  background:#0b0b0b;
}

.card:hover{
  border-color:var(--gold-line);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.info{
  padding:18px;
}

.code{
  color:var(--gold);
  font-size:11px;
  letter-spacing:1px;
}

.name{
  margin-top:7px;
  color:#eee;
  font-size:16px;
  font-weight:600;
}

.price{
  margin-top:9px;
  color:var(--gold-light);
  font-size:23px;
  font-weight:700;
}

.actions2{
  margin-top:16px;
  display:flex;
  gap:8px;
}

.actions2 button{
  flex:1;
}

.empty{
  padding:70px;
  text-align:center;
  color:#777;
  border:1px solid var(--line);
}

@media(max-width:1200px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .user{
    display:none;
  }
}

@media(max-width:600px){

  .header{
    flex-direction:column;
    align-items:stretch;
    padding:14px 20px;
    gap:14px;
  }

  .nav{
    flex-wrap:wrap;
  }

  .nav a{
    flex:1;
  }

  .page{
    width:calc(100% - 28px);
  }

  .top{
    flex-direction:column;
    align-items:flex-start;
    gap:20px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">

    <a href="admin.html">
      <img
        src="assets/logo.png"
        class="logo"
        alt="CHATPHETCH GROUP"
      >
    </a>

    <div>
      <div class="brand-name">
        CHATPHETCH GROUP
      </div>

      <div class="brand-sub">
        BACK OFFICE
      </div>
    </div>

  </div>

  <nav class="nav">

    <a href="admin.html">
      หน้าแรก
    </a>

    <a href="products.html">
      สินค้า
    </a>

    <a href="admin-products.html" class="active">
      จัดการสินค้า
    </a>

    <a href="admin-users.html">
      ผู้ใช้งาน
    </a>

    <span class="user" id="userName">
      เจ้าของบริษัท · OWNER
    </span>

    <button
      class="logout"
      id="logout"
    >
      ออกจากระบบ
    </button>

  </nav>

</header>


<main class="page">

  <div class="top">

    <div>

      <div class="kicker">
        PRODUCT MANAGEMENT
      </div>

      <h1>
        จัดการสินค้า
      </h1>

      <div class="desc">
        Owner · จัดการสินค้า ลบสินค้า และจัดการข้อมูลหน้าร้าน
      </div>

    </div>

    <div class="actions">

      <button
        class="btn"
        onclick="loadProducts()"
      >
        ↻ รีเฟรช
      </button>

      <button
        class="btn gold"
        onclick="alert('ส่วนเพิ่มสินค้าสามารถเชื่อมกับฟอร์มเพิ่มสินค้าได้')"
      >
        ＋ เพิ่มสินค้า
      </button>

    </div>

  </div>


  <div class="stats">

    <div class="stat">
      <small>PRODUCTS</small>
      <strong id="total">0</strong>
    </div>

    <div class="stat">
      <small>VISIBLE</small>
      <strong id="visible">0</strong>
    </div>

    <div class="stat">
      <small>HIDDEN</small>
      <strong id="hidden">0</strong>
    </div>

    <div class="stat">
      <small>CATEGORIES</small>
      <strong id="categories">0</strong>
    </div>

  </div>


  <div class="toolbar">

    <input
      id="search"
      placeholder="ค้นหาสินค้า / รหัสสินค้า"
    >

    <select id="category">

      <option value="">
        ทุกหมวดหมู่
      </option>

      <option value="floor">
        พื้น
      </option>

      <option value="coating">
        น้ำยาเคลือบ
      </option>

      <option value="other">
        อื่น ๆ
      </option>

    </select>

  </div>


  <div
    class="grid"
    id="productGrid"
  ></div>

</main>


<script>

const SUPABASE_URL =
  "https://mfhllgklcfnnbyyzzljz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let products=[];


/* ================= PRODUCTS ================= */

const defaultProducts=[

  {
    id:"91428",
    name:"PREMIUM STAMPED CONCRETE (PSC)",
    code:"91428",
    category:"floor",
    image:"assets/products/91428.jpg",
    price:799,
    visible:true
  },

  {
    id:"91427",
    name:"RELEASER POWER",
    code:"91427",
    category:"floor",
    image:"assets/products/releaser-power.jpg",
    price:1050,
    visible:true
  },

  {
    id:"91430",
    name:"READY COAT (RCT)",
    code:"91430",
    category:"coating",
    image:"assets/products/91430.jpg",
    price:388,
    visible:true
  },

  {
    id:"91429",
    name:"READY COAT COLOR (RCR)",
    code:"91429",
    category:"coating",
    image:"assets/products/91429.jpg",
    price:369,
    visible:true
  }

];


function money(value){

  return Number(value||0)
    .toLocaleString(
      "th-TH"
    ) + " ฿";

}


function render(){

  const keyword =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();

  const category =
    document.getElementById(
      "category"
    ).value;

  const list =
    products.filter(p=>{

      const matchText =
        !keyword ||
        (
          p.name +
          " " +
          p.code
        )
        .toLowerCase()
        .includes(keyword);

      const matchCategory =
        !category ||
        p.category === category;

      return (
        matchText &&
        matchCategory
      );

    });


  if(!list.length){

    document.getElementById(
      "productGrid"
    ).innerHTML=`
      <div class="empty">
        ไม่พบสินค้า
      </div>
    `;

    return;

  }


  document.getElementById(
    "productGrid"
  ).innerHTML =
    list.map(p=>`

      <article class="card">

        <img
          src="${p.image}"
          alt="${p.name}"
          onerror="this.style.display='none'"
        >

        <div class="info">

          <div class="code">
            ${p.code}
          </div>

          <div class="name">
            ${p.name}
          </div>

          <div class="price">
            ${money(p.price)}
          </div>

          <div class="actions2">

            <button
              class="btn"
              onclick="location.href='product-detail.html?id=${p.id}'"
            >
              ดูสินค้า
            </button>

            <button
              class="btn"
              onclick="alert('แก้ไขสินค้า ${p.code}')"
            >
              แก้ไข
            </button>

          </div>

        </div>

      </article>

    `).join("");

}


async function loadProducts(){

  products =
    defaultProducts.slice();

  /*
    ถ้ามี table products ใน Supabase
    ให้ใช้ข้อมูลจากฐานข้อมูลแทนได้ในภายหลัง
  */

  updateStats();

  render();

}


function updateStats(){

  document.getElementById(
    "total"
  ).textContent =
    products.length;

  document.getElementById(
    "visible"
  ).textContent =
    products.filter(
      p=>p.visible
    ).length;

  document.getElementById(
    "hidden"
  ).textContent =
    products.filter(
      p=>!p.visible
    ).length;

  document.getElementById(
    "categories"
  ).textContent =
    new Set(
      products.map(
        p=>p.category
      )
    ).size;

}


async function init(){

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();

  if(!data.session){

    location.href =
      "admin.html";

    return;

  }

  const user =
    data.session.user;

  const {
    data:admin
  } =
    await supabaseClient
      .from("admin_users")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();

  if(
    !admin ||
    !admin.active
  ){

    await supabaseClient
      .auth
      .signOut();

    location.href =
      "admin.html";

    return;

  }

  document.getElementById(
    "userName"
  ).textContent =
    `${admin.name || "ผู้ดูแล"} · ${String(admin.role).toUpperCase()}`;

  await loadProducts();

}


document.getElementById(
  "search"
).addEventListener(
  "input",
  render
);

document.getElementById(
  "category"
).addEventListener(
  "change",
  render
);

document.getElementById(
  "logout"
).addEventListener(
  "click",
  async()=>{

    await supabaseClient
      .auth
      .signOut();

    location.href =
      "admin.html";

  }
);


init();

</script>

</body>
</html>
