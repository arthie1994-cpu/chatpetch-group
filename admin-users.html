<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHATPHETCH GROUP — ผู้ใช้งาน</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --black:#050505;
  --dark:#0d0d0d;
  --gold:#c8a45b;
  --gold-light:#f0d991;
  --line:rgba(255,255,255,.09);
  --gold-line:rgba(200,164,91,.30);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  color:#fff;

  font-family:
    "Prompt",
    "Kanit",
    sans-serif;

  background:
    radial-gradient(circle at 12% 12%,rgba(200,164,91,.075),transparent 28%),
    radial-gradient(circle at 88% 20%,rgba(200,164,91,.055),transparent 28%),
    #050505;
}

body:before{
  content:"";
  position:fixed;
  inset:0;

  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);

  background-size:40px 40px;

  pointer-events:none;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:100px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 4vw;

  background:rgba(5,5,5,.95);

  border-top:1px solid rgba(200,164,91,.35);
  border-bottom:1px solid var(--line);

  backdrop-filter:blur(18px);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:52px;
  height:52px;

  object-fit:contain;

  border:1px solid var(--gold);
}

.brand-name{
  font-size:18px;
  font-weight:700;
}

.brand-sub{
  color:#777;
  font-size:11px;
  letter-spacing:2px;
}

.nav{
  display:flex;
  align-items:center;
  gap:7px;
}

.nav a,
.logout{
  min-height:40px;
  padding:0 15px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#aaa;
  text-decoration:none;

  border:1px solid rgba(255,255,255,.08);

  background:#090909;

  font-family:inherit;
  font-size:13px;

  cursor:pointer;
}

.nav a:hover,
.nav a.active,
.logout:hover{
  color:var(--gold-light);
  border-color:var(--gold-line);
}

.user{
  color:#777;
  font-size:12px;
}

.page{
  position:relative;
  z-index:1;

  width:min(
    calc(100% - 48px),
    1540px
  );

  margin:auto;

  padding:55px 0 80px;
}

.kicker{
  color:var(--gold);
  font-size:13px;
  letter-spacing:4px;
  font-weight:600;
}

h1{
  margin:7px 0 0;

  font-size:clamp(42px,5vw,60px);
  line-height:1.2;
}

.desc{
  margin-top:10px;
  color:#777;
  font-size:14px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  margin-bottom:35px;
}

.btn{
  min-height:44px;
  padding:0 18px;

  border:1px solid rgba(255,255,255,.11);

  background:#101010;

  color:#ddd;

  font-family:inherit;

  cursor:pointer;
}

.btn:hover{
  color:var(--gold-light);
  border-color:var(--gold-line);
}

.table{
  overflow:auto;

  border:1px solid var(--line);

  background:#080808;
}

table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

th{
  padding:18px;

  color:var(--gold-light);

  background:#111;

  text-align:left;

  font-size:13px;

  border-bottom:1px solid var(--line);
}

td{
  padding:18px;

  color:#ccc;

  font-size:13px;

  border-bottom:1px solid rgba(255,255,255,.07);
}

.name{
  color:#eee;
  font-weight:600;
}

.email{
  color:#777;
  font-size:12px;
}

.role{
  display:inline-flex;

  padding:6px 12px;

  border-radius:999px;

  color:var(--gold-light);

  background:rgba(200,164,91,.10);

  font-size:11px;
}

.active{
  color:#5cdb8d;
}

.inactive{
  color:#ff7777;
}

@media(max-width:900px){

  .user{
    display:none;
  }

}

@media(max-width:600px){

  .header{
    flex-direction:column;
    align-items:stretch;

    padding:14px 20px;

    gap:14px;
  }

  .nav{
    flex-wrap:wrap;
  }

  .nav a{
    flex:1;
  }

  .page{
    width:calc(100% - 28px);
  }

  .top{
    flex-direction:column;
    align-items:flex-start;

    gap:20px;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="brand">

    <a href="admin.html">
      <img
        src="assets/logo.png"
        class="logo"
        alt="CHATPHETCH GROUP"
      >
    </a>

    <div>

      <div class="brand-name">
        CHATPHETCH GROUP
      </div>

      <div class="brand-sub">
        BACK OFFICE
      </div>

    </div>

  </div>


  <nav class="nav">

    <a href="admin.html">
      หน้าแรก
    </a>

    <a href="products.html">
      สินค้า
    </a>

    <a href="admin-products.html">
      จัดการสินค้า
    </a>

    <a
      href="admin-users.html"
      class="active"
    >
      ผู้ใช้งาน
    </a>

    <span
      class="user"
      id="user"
    >
      เจ้าของบริษัท · OWNER
    </span>

    <button
      class="logout"
      id="logout"
    >
      ออกจากระบบ
    </button>

  </nav>

</header>


<main class="page">

  <div class="top">

    <div>

      <div class="kicker">
        USER MANAGEMENT
      </div>

      <h1>
        จัดการผู้ใช้งาน
      </h1>

      <div class="desc">
        จัดการบัญชีผู้ดูแลระบบและสิทธิ์การใช้งาน
      </div>

    </div>

    <button
      class="btn"
      onclick="loadUsers()"
    >
      ↻ รีเฟรช
    </button>

  </div>


  <div class="table">

    <table>

      <thead>

        <tr>

          <th>
            ผู้ใช้งาน
          </th>

          <th>
            Email
          </th>

          <th>
            Role
          </th>

          <th>
            สถานะ
          </th>

          <th>
            วันที่เพิ่ม
          </th>

        </tr>

      </thead>

      <tbody id="body">

        <tr>
          <td colspan="5">
            กำลังโหลด...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://mfhllgklcfnnbyyzzljz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function escapeHTML(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(v){

  if(!v) return "-";

  return new Date(v)
    .toLocaleString(
      "th-TH",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


async function loadUsers(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("*")
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(error){

    document.getElementById(
      "body"
    ).innerHTML=`

      <tr>
        <td colspan="5">
          ${escapeHTML(
            error.message
          )}
        </td>
      </tr>

    `;

    return;

  }


  document.getElementById(
    "body"
  ).innerHTML =
    (data || []).map(u=>`

      <tr>

        <td>

          <div class="name">
            ${escapeHTML(
              u.name || "-"
            )}
          </div>

        </td>

        <td>

          <div class="email">
            ${escapeHTML(
              u.email || "-"
            )}
          </div>

        </td>

        <td>

          <span class="role">
            ${escapeHTML(
              String(
                u.role || "viewer"
              ).toUpperCase()
            )}
          </span>

        </td>

        <td>

          <span class="${
            u.active
              ? "active"
              : "inactive"
          }">

            ${
              u.active
                ? "● เปิดใช้งาน"
                : "● ปิดใช้งาน"
            }

          </span>

        </td>

        <td>
          ${formatDate(
            u.created_at
          )}
        </td>

      </tr>

    `).join("");

}


async function init(){

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();

  if(!data.session){

    location.href =
      "admin.html";

    return;

  }

  const user =
    data.session.user;

  const {
    data:admin
  } =
    await supabaseClient
      .from("admin_users")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();

  if(
    !admin ||
    !admin.active
  ){

    location.href =
      "admin.html";

    return;

  }

  document.getElementById(
    "user"
  ).textContent =
    `${admin.name || "ผู้ดูแล"} · ${String(admin.role).toUpperCase()}`;

  await loadUsers();

}


document.getElementById(
  "logout"
).addEventListener(
  "click",
  async()=>{

    await supabaseClient
      .auth
      .signOut();

    location.href =
      "admin.html";

  }
);


init();

</script>

</body>
</html>
