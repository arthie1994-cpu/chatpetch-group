  /* =========================================================
     HELPERS
  ========================================================= */

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "-";
    }

    return date.toLocaleString(
      "th-TH",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );
  }

  function money(value) {
    return Number(value || 0).toLocaleString(
      "th-TH",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );
  }

  function statusInfo(status) {
    return (
      STATUS[status] || {
        label: status || "รอตรวจสอบ",
        cls: "pending"
      }
    );
  }

  function canUpdate() {
    return [
      "owner",
      "manager",
      "staff"
    ].includes(currentRole);

  function canDelete() {
    return currentRole === "owner";

            Admin Login

            Chatpetch Group

          </p>

            id="authEmail"
            class="auth-input"
            type="email"
            autocomplete="username"
            placeholder="อีเมล"
          >

          <input
            id="authPassword"
            class="auth-input"
            type="password"
            autocomplete="current-password"
            placeholder="รหัสผ่าน"
          >

          <div
            id="authError"
            class="auth-error"
          ></div>

          <button
            id="authBtn"
            class="auth-btn"
          >
            เข้าสู่ระบบ
          </button>

        </div>
      `;

    }

    screen.style.display = "grid";

    const btn =
      document.getElementById("authBtn");

    if (btn) {
      btn.onclick = login;
    }

    const password =
      document.getElementById(
        "authPassword"
      );

    if (password) {
      password.onkeydown = event => {
        if (event.key === "Enter") {
          login();
        }
      };
    }
  }

  function hideLogin() {
    const screen =
      document.getElementById(
        "authScreen"
      );

    if (screen) {
      screen.style.display = "none";
    }
  }

  async function login() {
    const email =
      document.getElementById(
        "authEmail"
      )?.value.trim();

    const password =
      document.getElementById(
        "authPassword"
      )?.value;

    const errorBox =
      document.getElementById(
        "authError"
      );

    if (errorBox) {
      errorBox.textContent = "";
    }

    if (!email || !password) {
      if (errorBox) {
        errorBox.textContent =
          "กรุณากรอกอีเมลและรหัสผ่าน";
      }
      return;
    }

    const {
      error
    } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if (error && errorBox) {
      errorBox.textContent =
        error.message ||
        "เข้าสู่ระบบไม่สำเร็จ";
    }
  }

  /* =========================================================

  async function loadOrders() {
    try {
      const {
        data,
        error
      } =
        await db
          .from("orders")
          .select("*")
          .order(
            "created_at",
            {
              ascending:false
            }
          );

      if (error) {
        throw error;
      }

      orders = Array.isArray(data)
        ? data
        : [];

      await loadAllOrderItems();

      updateDashboard();

      renderOrders();

    } catch (error) {
      console.error(
        "LOAD ORDERS ERROR:",
        error
      );

      showToast(
        error.message ||
        "ไม่สามารถโหลดคำสั่งซื้อได้"
      );
    }
  }

  /* =========================================================
     LOAD ORDER ITEMS
  ========================================================= */

  async function loadAllOrderItems() {
    orderItemsMap = {};

    if (!orders.length) {
      return;
    }

    const orderIds =
      orders.map(order => order.id);

    const {
      data,
      error
    } =
      await db
        .from("order_items")
        .select("*")
        .in(
          "order_id",
          orderIds
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );

    if (error) {
      console.warn(
        "ORDER ITEMS:",
        error
      );

      return;
    }

    (data || []).forEach(item => {
      if (
        !orderItemsMap[item.order_id]
      ) {
        orderItemsMap[
          item.order_id
        ] = [];
      }

      orderItemsMap[
        item.order_id
      ].push(item);
    });
  }

  function getOrderItems(order) {
    return (
      orderItemsMap[
        order.id
      ] || []
    );
  }

  function getOrderItemQuantity(order) {
    return getOrderItems(order)
      .reduce(
        (total,item) =>
          total +
          Number(
            item.quantity || 0
          ),
        0
      );
  }

  /* =========================================================
     DASHBOARD STATS
  ========================================================= */

  function updateDashboard() {

    const all =
      orders.length;

    const pending =
      orders.filter(
        order =>
          order.status ===
          "pending"
      ).length;

    const shipping =
      orders.filter(
        order =>
          order.status ===
          "shipping"
      ).length;

    const completed =
      orders.filter(
        order =>
          order.status ===
          "completed"
      ).length;

    const confirmed =
      orders.filter(
        order =>
          order.status ===
          "confirmed"
      ).length;

    const cancelled =
      orders.filter(
        order =>
          order.status ===
          "cancelled"
      ).length;

    const total =
      orders.reduce(
        (sum,order) =>
          sum +
          Number(
            order.total || 0
          ),
        0
      );

    const pendingTotal =
      orders
        .filter(
          order =>
            order.status ===
            "pending"
        )
        .reduce(
          (sum,order) =>
            sum +
            Number(
              order.total || 0
            ),
          0
        );

    const completedTotal =
      orders
        .filter(
          order =>
            order.status ===
            "completed"
        )
        .reduce(
          (sum,order) =>
            sum +
            Number(
              order.total || 0
            ),
          0
        );

    const quantityTotal =
      orders.reduce(
        (sum,order) =>
          sum +
          getOrderItemQuantity(
            order
          ),
        0
      );

    const statAll =
      document.getElementById(
        "statAll"
      );

    const statPending =
      document.getElementById(
        "statPending"
      );

    const statShipping =
      document.getElementById(
        "statShipping"
      );

    const statCompleted =
      document.getElementById(
        "statCompleted"
      );

    if (statAll) {
      statAll.textContent =
        all;
    }

    if (statPending) {
      statPending.textContent =
        pending;
    }

    if (statShipping) {
      statShipping.textContent =
        shipping;
    }

    if (statCompleted) {
      statCompleted.textContent =
        completed;
    }

    let strip =
      document.getElementById(
        "summaryStrip"
      );

    if (!strip) {

      strip =
        document.createElement(
          "div"
        );

      strip.id =
        "summaryStrip";

      strip.className =
        "summary-strip reveal";

      const stats =
        document.querySelector(
          ".stats-grid"
        );

      if (stats) {
        stats.after(strip);
      }
    }

    strip.innerHTML = `
      <div class="summary-box gold">

        <small>
          ยอดขายรวม
        </small>

        <strong>
          ฿${money(total)}
        </strong>

        <div class="mini-value">
          จาก ${all} คำสั่งซื้อ
        </div>

      </div>


      <div class="summary-box">

        <small>
          ยอดรอตรวจสอบ
        </small>

        <strong>
          ฿${money(pendingTotal)}
        </strong>

        <div class="mini-value">
          ${pending} คำสั่งซื้อ
        </div>

      </div>


      <div class="summary-box">

        <small>
          ยอดขายสำเร็จ
        </small>

        <strong>
          ฿${money(completedTotal)}
        </strong>

        <div class="mini-value">
          ${completed} คำสั่งซื้อ
        </div>

      </div>


      <div class="summary-box">

        <small>
          สินค้าทั้งหมดในออเดอร์
        </small>

        <strong>
          ${quantityTotal}
        </strong>

        <div class="mini-value">
          ยืนยันแล้ว ${confirmed}
          · ยกเลิก ${cancelled}
        </div>

      </div>
    `;

    strip.classList.add(
      "active"
    );

    const hero =

        ".admin-hero .container"
      );

    if (
      hero &&
      !document.getElementById(

    ) {

      const status =
        document.createElement(
          "div"
        );

      status.id =
        "heroStatus";

      status.className =

      status.textContent =
        currentAdmin
          ? `เข้าสู่ระบบในสิทธิ์ ${currentAdmin.role}`

  /* =========================================================
     FILTER
  ========================================================= */

  function getFilteredOrders() {

    const search =
      document
        .getElementById(
          "searchInput"
        )
        ?.value
        .trim()
        .toLowerCase() || "";

    const status =
      document
        .getElementById(
          "statusFilter"
        )?.value || "all";

    return orders
      .map(
        (
          order,
          index
        ) => ({
          order,
          index
        })
      )
      .filter(
        ({
          order
        }) => {

          const searchable =
            [
              order.id,
              order.order_number,
              order.customer_name,
              order.customer_phone,
              order.customer_email,
              order.customer_province,
              order.customer_address,
              order.payment_method,
              order.customer_note
            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();

          const matchesSearch =
            !search ||
            searchable.includes(
              search
            );

          const matchesStatus =
            status === "all" ||
            order.status === status;

          return (
            matchesSearch &&
            matchesStatus
          );
        }
      );
  }

      document.getElementById(

      );

    }

    }

                      "-"
                    )}
                  </div>

                  <div class="order-date">
                    ฿${money(
                      order.total
                    )}
                  </div>

                </td>


                <td>

                  <span
                    class="status ${status.cls}"
                  >
                    ${escapeHtml(
                      status.label
                    )}
                  </span>

                </td>


                <td>

                  <div class="order-date">
                    ${formatDate(
                      order.created_at
                    )}
                  </div>

                </td>


                <td>

                  <div class="row-actions">

                    <button
                      class="icon-btn"
                      title="ดูรายละเอียด"
                      data-action="view"
                      data-id="${escapeHtml(
                        order.id
                      )}"
                    >
                      ⌕
                    </button>

                    ${
                      canDelete()
                        ? `
                          <button
                            class="icon-btn delete"
                            title="ลบ"
                            data-action="delete"
                            data-id="${escapeHtml(
                              order.id
                            )}"
                          >
                            ×
                          </button>
                        `
                        : ""
                    }

                  </div>

                </td>

              </tr>
            `;
          }
        )
        .join("");
  }

  /* =========================================================
     ORDER DETAIL
  ========================================================= */

  async function openOrder(id) {

    const order =
      orders.find(
        item => item.id === id
      );

    if (!order) {
      return;
    }

    selectedOrderId =
      id;

    let items =
      getOrderItems(order);

    if (!items.length) {

      const {
        data
      } =
        await db
          .from("order_items")
          .select("*")
          .eq(
            "order_id",
            id
          )
          .order(
            "created_at",
            {
              ascending:true
            }
          );

      items =
        data || [];

      orderItemsMap[id] =
        items;
    }

    const modal =
      document.getElementById(
        "orderModal"
      );

    const modalBody =
      document.getElementById(
        "modalBody"
      );

    if (!modal || !modalBody) {
      return;
    }

    const status =
      statusInfo(
        order.status
      );

    const quantity =
      items.reduce(
        (sum,item) =>
          sum +
          Number(
            item.quantity || 0
          ),
        0
      );

    const customerAddress =
      [
        order.customer_address,
        order.customer_province
      ]
        .filter(Boolean)
        .join(" ");

    const itemsHtml =
      items.length
        ? items
            .map(
              item => {

                const image =
                  item.product_image ||
                  "";

                return `
                  <div class="detail-item">

                    <div class="detail-item-image">

                      ${
                        image
                          ? `
                            <img
                              src="${escapeHtml(
                                image
                              )}"
                              alt="${escapeHtml(
                                item.product_name ||
                                "สินค้า"
                              )}"
                              onerror="
                                this.style.display='none'
                              "
                            >
                          `
                          : ""
                      }

                    </div>


                    <div style="min-width:0;">

                      <div class="detail-item-name">
                        ${escapeHtml(
                          item.product_name ||
                          "สินค้า"
                        )}
                      </div>

                      <div class="detail-item-meta">

                        ${
                          item.product_id
                            ? `รหัส ${escapeHtml(
                                item.product_id
                              )}`
                            : ""
                        }

                        ${
                          item.price_label
                            ? ` · ${escapeHtml(
                                item.price_label
                              )}`
                            : ""
                        }

                      </div>

                      ${
                        item.selected_option
                          ? `
                            <div
                              class="detail-item-meta"
                            >
                              ${escapeHtml(
                                formatOption(
                                  item.selected_option
                                )
                              )}
                            </div>
                          `
                          : ""
                      }

                    </div>


                    <div
                      style="
                        margin-left:auto;
                        text-align:right;
                        flex-shrink:0;
                      "
                    >

                      <div
                        class="detail-item-quantity"
                      >
                        ×
                        ${Number(
                          item.quantity || 1
                        )}
                      </div>

                      <div
                        class="detail-item-meta"
                      >
                        ฿${money(
                          item.line_total ||
                          (
                            Number(
                              item.unit_price || 0
                            ) *
                            Number(
                              item.quantity || 1
                            )
                          )
                        )}
                      </div>

                    </div>

                  </div>
                `;
              }
            )
            .join("")
        : `
          <div
            style="
              color:#777;
              font-size:12px;
              padding:15px 0;
            "
          >
            ไม่พบรายการสินค้า
          </div>
        `;

    modalBody.innerHTML = `

      <div class="detail-mini-grid">

        <div class="detail-mini-card">
          <small>
            STATUS
          </small>
          <strong>
            ${escapeHtml(
              status.label
            )}
          </strong>
        </div>

        <div class="detail-mini-card">
          <small>
            TOTAL ITEMS
          </small>
          <strong>
            ${quantity} ชิ้น
          </strong>
        </div>

        <div class="detail-mini-card">
          <small>
            ORDER DATE
          </small>
          <strong>
            ${formatDate(
              order.created_at
            )}
          </strong>
        </div>

      </div>


      <div class="detail-grid">

        <div class="detail-card">

          <div class="detail-label">
            ORDER NUMBER
          </div>

          <div class="detail-value gold">
            ${escapeHtml(
              order.order_number ||
              order.id
            )}
          </div>

        </div>


        <div class="detail-card">

          <div class="detail-label">
            ORDER ID
          </div>

          <div class="detail-value">
            ${escapeHtml(
              order.id ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-card">

          <div class="detail-label">
            CUSTOMER
          </div>

          <div class="detail-value">
            ${escapeHtml(
              order.customer_name ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-card">

          <div class="detail-label">
            PHONE
          </div>

          <div class="detail-value">
            ${escapeHtml(
              order.customer_phone ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-card">

          <div class="detail-label">
            EMAIL
          </div>

          <div class="detail-value">
            ${escapeHtml(
              order.customer_email ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-card">

          <div class="detail-label">
            PAYMENT
          </div>

          <div class="detail-value">
            ${escapeHtml(
              order.payment_method ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-card">

          <div class="detail-label">
            ADDRESS
          </div>

          <div
            class="
              detail-value
              customer-address-block
            "
          >
            ${escapeHtml(
              customerAddress ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-card">

          <div class="detail-label">
            NOTE
          </div>

          <div class="detail-value">
            ${escapeHtml(
              order.customer_note ||
              "-"
            )}
          </div>

        </div>

      </div>


      <h3 class="detail-section-title">
        สินค้าในคำสั่งซื้อ
      </h3>


      <div class="detail-items">

        ${itemsHtml}

      </div>


      <div class="detail-total-row">

        <span>
          ยอดรวมคำสั่งซื้อ
        </span>

        <strong>
          ฿${money(
            order.total
          )}
        </strong>

      </div>


      ${
        order.slip_path
          ? `
            <a
              class="slip-link"
              href="${escapeHtml(
                order.slip_path
              )}"
              target="_blank"
              rel="noopener"
            >
              ดูหลักฐานการชำระเงิน ↗
            </a>
          `
          : `
            <div
              style="
                color:#666;
                font-size:10px;
                margin-top:15px;
              "
            >
              ยังไม่มีหลักฐานการชำระเงิน
            </div>
          `
      }


      <div
        class="status-edit"
        style="margin-top:20px;"
      >

        <select
          id="modalStatus"
          class="status-select"
          ${canUpdate() ? "" : "disabled"}
        >

          ${Object.entries(
            STATUS
          )
            .map(
              ([key,value]) => `
                <option
                  value="${key}"
                  ${
                    order.status === key
                      ? "selected"
                      : ""
                  }
                >
                  ${value.label}
                </option>
              `
            )
            .join("")}

        </select>


        ${
          canUpdate()
            ? `
              <button
                class="btn btn-gold"
                id="saveStatusBtn"
              >
                บันทึกสถานะ
              </button>
            `
            : ""
        }

      </div>
    `;

    modal.classList.add(
      "show"
    );

    document
      .getElementById(
        "saveStatusBtn"
      )
      ?.addEventListener(
        "click",
        saveStatus
      );
  }

  function formatOption(option) {

    if (!option) {
      return "";
    }

    if (
      typeof option ===
      "string"
    ) {
      return option;
    }

    if (
      typeof option ===
      "object"
    ) {

      return Object.entries(
        option
      )
        .map(
          ([key,value]) =>
            `${key}: ${
              typeof value === "object"
                ? JSON.stringify(value)
                : value
            }`
        )
        .join(" · ");
    }

    return String(option);
  }

  /* =========================================================
     STATUS UPDATE
  ========================================================= */

  async function saveStatus() {

    if (
      !selectedOrderId ||
      !canUpdate()
    ) {
      return;
    }

    const select =
      document.getElementById(
        "modalStatus"
      );

    if (!select) {
      return;
    }

    const status =
      select.value;

    const {
      error
    } =
      await db
        .from("orders")
        .update({
          status
        })
        .eq(
          "id",
          selectedOrderId
        );

    if (error) {
      showToast(
        error.message ||
        "ไม่สามารถบันทึกสถานะได้"
      );
      return;
    }

    showToast(
      "อัปเดตสถานะเรียบร้อย"
    );

    closeModal();

    await loadOrders();
  }

  /* =========================================================
     DELETE
  ========================================================= */

  async function deleteOrder(id) {

    if (!canDelete()) {
      return;
    }

    const order =
      orders.find(
        item => item.id === id
      );

    if (!order) {
      return;
    }

    const confirmed =
      confirm(
        `ต้องการลบคำสั่งซื้อ ${
          order.order_number ||
          order.id
        } หรือไม่?`
      );

    if (!confirmed) {
      return;
    }

    const itemDelete =
      await db
        .from("order_items")
        .delete()
        .eq(
          "order_id",
          id
        );

    if (itemDelete.error) {
      showToast(
        itemDelete.error.message
      );
      return;
    }

    const {
      error
    } =
      await db
        .from("orders")
        .delete()
        .eq(
          "id",
          id
        );

    if (error) {
      showToast(
        error.message ||
        "ไม่สามารถลบคำสั่งซื้อได้"
      );
      return;
    }

    showToast(
      "ลบคำสั่งซื้อแล้ว"
    );

    await loadOrders();
  }

  /* =========================================================
     CLEAR ALL
  ========================================================= */

  async function clearAll() {

    if (
      !canDelete() ||
      !orders.length
    ) {
      return;
    }

    const confirmed =
      confirm(
        "ต้องการลบคำสั่งซื้อทั้งหมดหรือไม่?"
      );

    if (!confirmed) {
      return;
    }

    const orderIds =
      orders.map(
        order => order.id
      );

    if (orderIds.length) {

      const itemDelete =
        await db
          .from("order_items")
          .delete()
          .in(
            "order_id",
            orderIds
          );

      if (itemDelete.error) {
        showToast(
          itemDelete.error.message
        );
        return;
      }

    }

    const {
      error
    } =
      await db
        .from("orders")
        .delete()
        .in(
          "id",
          orderIds
        );

    if (error) {
      showToast(
        error.message ||
        "ไม่สามารถล้างคำสั่งซื้อได้"
      );
      return;
    }

    showToast(
      "ล้างคำสั่งซื้อแล้ว"
    );

    await loadOrders();
  }

  /* =========================================================
     EXPORT
  ========================================================= */

  function exportJSON() {

    const exportData =
      orders.map(
        order => ({
          ...order,
          items:
            getOrderItems(
              order
            )
        })
      );

    const blob =
      new Blob(
        [
          JSON.stringify(
            exportData,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        "a"
      );

    link.href = url;

    link.download =
      `chatpetch-orders-${new Date()
        .toISOString()
        .slice(0,10)}.json`;

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
      url
    );
  }

  /* =========================================================
     TOAST
  ========================================================= */

  let toastTimer = null;

  function showToast(message) {

    const toast =
      document.getElementById(
        "toast"
      );

    if (!toast) {
      return;
    }

    toast.textContent =
      message;

    toast.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {
          toast.classList.remove(
            "show"
          );
        },
        3500
      );
  }

  /* =========================================================
     CLOSE MODAL
  ========================================================= */

  function closeModal() {

    const modal =
      document.getElementById(
        "orderModal"
      );

    if (modal) {
      modal.classList.remove(
        "show"
      );
    }

    selectedOrderId =
      null;
  }

  /* =========================================================
     EVENTS
  ========================================================= */

  const ordersTable =
    document.getElementById(
      "ordersTable"
    );

  if (ordersTable) {

    ordersTable.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "button[data-action]"
          );

        if (!button) {
          return;
        }

        const action =
          button.dataset.action;

        const id =
          button.dataset.id;

        if (
          action === "view"
        ) {
          openOrder(id);
        }

        if (
          action === "delete"
        ) {
          deleteOrder(id);
        }
      }
    );
  }

  document
    .getElementById(
      "refreshBtn"
    )
    ?.addEventListener(
      "click",
      async () => {
        await loadOrders();
        showToast(
          "รีเฟรชข้อมูลเรียบร้อย"
        );
      }
    );

  document
    .getElementById(
      "exportBtn"
    )
    ?.addEventListener(
      "click",
      exportJSON
    );

  document
    .getElementById(
      "clearAllBtn"
    )
    ?.addEventListener(
      "click",
      clearAll
    );

  document
    .getElementById(
      "searchInput"
    )
    ?.addEventListener(
      "input",
      renderOrders
    );

  document
    .getElementById(
      "statusFilter"
    )
    ?.addEventListener(
      "change",
      renderOrders
    );

  document
    .getElementById(
      "modalClose"
    )
    ?.addEventListener(
      "click",
      closeModal
    );

  document
    .getElementById(
      "modalCancel"
    )
    ?.addEventListener(
      "click",
      closeModal
    );

  document
    .getElementById(
      "orderModal"
    )
    ?.addEventListener(
      "click",
      event => {
        if (
          event.target ===
          event.currentTarget
        ) {
          closeModal();
        }
      }
    );

  document.addEventListener(
    "keydown",
    event => {
      if (
        event.key ===
        "Escape"
      ) {
        closeModal();
      }
    }
  );

  document
    .getElementById(
      "mobileBtn"
    )
    ?.addEventListener(
      "click",
      () => {
        document
          .getElementById(
            "navMenu"
          )
          ?.classList.toggle(
            "open"
          );
      }
    );

  document
    .querySelectorAll(
      ".nav-menu a"
    )
    .forEach(
      link => {
        link.addEventListener(
          "click",
          () => {
            document
              .getElementById(
                "navMenu"
              )
              ?.classList.remove(
                "open"
              );
          }
        );
      }
    );

  /* =========================================================
     REVEAL
  ========================================================= */

  if (
    "IntersectionObserver"
    in window
  ) {

    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(
            entry => {

              if (
                entry.isIntersecting
              ) {

                entry.target.classList.add(
                  "active"
                );

                observer.unobserve(
                  entry.target
                );
              }

            }
          );
        },
        {
          threshold:.08
        }
      );

    document
      .querySelectorAll(
        ".reveal"
      )
      .forEach(
        element =>
          observer.observe(
            element
          )
      );
  } else {

    document
      .querySelectorAll(
        ".reveal"
      )
      .forEach(
        element =>
          element.classList.add(
            "active"
          )
      );
  }

  /* =========================================================
     BOOT
  ========================================================= */

  async function boot() {

    addLoginStyles();

    try {

      const {
        data,
        error
      } =
        await db.auth.getSession();

      if (error) {
        throw error;
      }

      const session =
        data?.session;

      if (!session) {
        showLogin();
        return;
      }

      currentUser =
        session.user;

      await loadAdminProfile(
        currentUser
      );

      hideLogin();

      await loadOrders();

    } catch (error) {

      console.error(
        "ADMIN BOOT ERROR:",
        error
      );

      showLogin();

      const errorBox =
        document.getElementById(
          "authError"
        );

      if (errorBox) {
        errorBox.textContent =
          error.message ||
          "ไม่สามารถเข้าสู่ระบบได้";
      }

      await db.auth.signOut();
    }
  }

  /* =========================================================
     AUTH STATE
  ========================================================= */

  db.auth.onAuthStateChange(
    async (
      event,
      session
    ) => {

      if (
        session &&
        !currentAdmin
      ) {

        try {

          currentUser =
            session.user;

          await loadAdminProfile(
            currentUser
          );

          hideLogin();

          await loadOrders();

        } catch (error) {

          console.error(
            "AUTH PROFILE ERROR:",
            error
          );

          showLogin();

          const errorBox =
            document.getElementById(
              "authError"
            );

          if (errorBox) {
            errorBox.textContent =
              error.message ||
              "ไม่มีสิทธิ์เข้าใช้งาน";
          }

          await db.auth.signOut();
        }

      } else if (
        !session
      ) {

        currentUser = null;
        currentAdmin = null;
        currentRole = null;

        showLogin();
      }
    }
  );

  boot();
</script>
