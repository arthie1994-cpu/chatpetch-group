<script>
/* =========================================================
   CHATPETCH GROUP
   CHECKOUT + SUPABASE
   ========================================================= */

(function () {

  "use strict";

  /* =======================================================
     SUPABASE CONFIG
     ======================================================= */

  const SUPABASE_URL =
    "https://mfhllgklcfnnbyyzzljz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";


  /* =======================================================
     CHECK SUPABASE SDK
     ======================================================= */

  if (!window.supabase) {

    console.error(
      "Supabase SDK is not loaded."
    );

    alert(
      "ไม่สามารถโหลดระบบฐานข้อมูลได้ กรุณารีเฟรชหน้าอีกครั้ง"
    );

    return;
  }


  /* =======================================================
     CREATE ONE CLIENT ONLY
     ======================================================= */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      }
    );


  /* =======================================================
     CONSTANTS
     ======================================================= */

  const CART_KEY = "chatpetch_cart";


  /* =======================================================
     DOM
     ======================================================= */

  const checkoutLayout =
    document.getElementById("checkoutLayout");

  const emptyCheckout =
    document.getElementById("emptyCheckout");

  const checkoutForm =
    document.getElementById("checkoutForm");

  const orderItemsEl =
    document.getElementById("orderItems");

  const itemCountText =
    document.getElementById("itemCountText");

  const subtotalEl =
    document.getElementById("subtotal");

  const grandTotalEl =
    document.getElementById("grandTotal");

  const submitOrderBtn =
    document.getElementById("submitOrderBtn");

  const submitText =
    document.getElementById("submitText");

  const cartBadge =
    document.getElementById("cartBadge");

  const toastEl =
    document.getElementById("toast");

  const successModal =
    document.getElementById("successModal");

  const successOrderNumber =
    document.getElementById("successOrderNumber");

  const navMenu =
    document.getElementById("navMenu");

  const menuToggle =
    document.getElementById("menuToggle");


  /* =======================================================
     MOBILE MENU
     ======================================================= */

  if (menuToggle && navMenu) {

    menuToggle.addEventListener(
      "click",
      function () {

        navMenu.classList.toggle("open");

      }
    );

  }


  /* =======================================================
     TOAST
     ======================================================= */

  let toastTimer = null;

  function showToast(
    message,
    type = "normal"
  ) {

    if (!toastEl) return;

    toastEl.textContent =
      message;

    toastEl.className =
      "toast show " +
      (
        type === "error"
          ? "error"
          : ""
      );

    clearTimeout(toastTimer);

    toastTimer =
      setTimeout(
        function () {

          toastEl.classList.remove(
            "show"
          );

        },
        4500
      );

  }


  /* =======================================================
     NUMBER
     ======================================================= */

  function toNumber(value) {

    if (
      typeof value === "number" &&
      Number.isFinite(value)
    ) {

      return value;

    }

    if (
      typeof value === "string"
    ) {

      const cleaned =
        value
          .replace(/,/g, "")
          .replace(/[^\d.-]/g, "");

      const number =
        Number(cleaned);

      return Number.isFinite(number)
        ? number
        : 0;

    }

    return 0;

  }


  /* =======================================================
     MONEY
     ======================================================= */

  function formatMoney(value) {

    return (
      "฿" +
      Number(value || 0)
        .toLocaleString(
          "th-TH",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          }
        )
    );

  }


  /* =======================================================
     ESCAPE HTML
     ======================================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =======================================================
     GET CART
     ======================================================= */

  function getCart() {

    try {

      const raw =
        localStorage.getItem(
          CART_KEY
        );

      if (!raw) {
        return [];
      }

      const cart =
        JSON.parse(raw);

      return Array.isArray(cart)
        ? cart
        : [];

    } catch (error) {

      console.error(
        "อ่านตะกร้าไม่สำเร็จ:",
        error
      );

      return [];

    }

  }


  /* =======================================================
     SAVE CART
     ======================================================= */

  function saveCart(cart) {

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

  }


  /* =======================================================
     CART BADGE
     ======================================================= */

  function updateCartBadge() {

    if (!cartBadge) return;

    const cart =
      getCart();

    const count =
      cart.reduce(
        function (sum, item) {

          return (
            sum +
            Math.max(
              1,
              Number(item.quantity) || 1
            )
          );

        },
        0
      );

    cartBadge.textContent =
      count;

  }


  /* =======================================================
     GET PRICE
     ======================================================= */

  function getItemPrice(item) {

    if (
      item.numericPrice !== undefined &&
      item.numericPrice !== null
    ) {

      return toNumber(
        item.numericPrice
      );

    }

    if (
      item.price !== undefined &&
      item.price !== null
    ) {

      return toNumber(
        item.price
      );

    }

    if (item.priceLabel) {

      return toNumber(
        item.priceLabel
      );

    }

    return 0;

  }


  /* =======================================================
     ITEM TOTAL
     ======================================================= */

  function getItemTotal(item) {

    const quantity =
      Math.max(
        1,
        Number(item.quantity) || 1
      );

    return (
      getItemPrice(item) *
      quantity
    );

  }


  /* =======================================================
     OPTION LABEL
     ======================================================= */

  function getOptionLabel(item) {

    if (
      item.selectedOption &&
      typeof item.selectedOption === "object"
    ) {

      const option =
        item.selectedOption;

      if (option.label) {
        return option.label;
      }

      if (option.name) {
        return option.name;
      }

      if (option.title) {
        return option.title;
      }

      if (option.size) {
        return option.size;
      }

    }

    if (
      typeof item.selectedOption === "string"
    ) {

      return item.selectedOption;

    }

    return "";

  }


  /* =======================================================
     IMAGE
     ======================================================= */

  function getImageHtml(item) {

    if (
      item.image &&
      typeof item.image === "string"
    ) {

      return `
        <div class="item-image">
          <img
            src="${escapeHtml(item.image)}"
            alt="${escapeHtml(item.name || "สินค้า")}"
            onerror="this.style.display='none';this.parentElement.classList.add('no-image');this.parentElement.innerHTML='CG';"
          >
        </div>
      `;

    }

    return `
      <div class="item-image no-image">
        CG
      </div>
    `;

  }


  /* =======================================================
     RENDER CART
     ======================================================= */

  function renderCart() {

    const cart =
      getCart();

    if (!cart.length) {

      checkoutLayout.style.display =
        "none";

      emptyCheckout.style.display =
        "block";

      return;

    }

    checkoutLayout.style.display =
      "grid";

    emptyCheckout.style.display =
      "none";

    orderItemsEl.innerHTML =
      "";

    let subtotal = 0;

    let totalQuantity = 0;


    cart.forEach(
      function (item) {

        const quantity =
          Math.max(
            1,
            Number(item.quantity) || 1
          );

        const itemTotal =
          getItemTotal(item);

        subtotal +=
          itemTotal;

        totalQuantity +=
          quantity;


        const optionLabel =
          getOptionLabel(item);

        const category =
          item.categoryLabel ||
          item.category ||
          "";


        const div =
          document.createElement(
            "div"
          );

        div.className =
          "order-item";


        div.innerHTML = `

          ${getImageHtml(item)}

          <div>

            <div class="item-name">
              ${escapeHtml(
                item.name ||
                "สินค้า"
              )}
            </div>

            <div class="item-meta">

              จำนวน:
              ${quantity}

              ${
                optionLabel
                  ? `<br>ตัวเลือก: ${escapeHtml(optionLabel)}`
                  : ""
              }

              ${
                category
                  ? `<br>${escapeHtml(category)}`
                  : ""
              }

            </div>

          </div>

          <div class="item-price">
            ${formatMoney(itemTotal)}
          </div>

        `;

        orderItemsEl.appendChild(
          div
        );

      }
    );


    itemCountText.textContent =
      `${totalQuantity} รายการ`;

    subtotalEl.textContent =
      formatMoney(subtotal);

    grandTotalEl.textContent =
      formatMoney(subtotal);

  }


  /* =======================================================
     PAYMENT UI
     ======================================================= */

  document
    .querySelectorAll(
      ".payment-option"
    )
    .forEach(
      function (option) {

        option.addEventListener(
          "click",
          function () {

            document
              .querySelectorAll(
                ".payment-option"
              )
              .forEach(
                function (element) {

                  element.classList.remove(
                    "active"
                  );

                }
              );

            option.classList.add(
              "active"
            );

            const radio =
              option.querySelector(
                'input[type="radio"]'
              );

            if (radio) {

              radio.checked =
                true;

            }

          }
        );

      }
    );


  /* =======================================================
     VALIDATE CART
     ======================================================= */

  function validateCart(cart) {

    if (!Array.isArray(cart)) {
      return false;
    }

    if (!cart.length) {
      return false;
    }

    for (
      const item of cart
    ) {

      if (
        !item ||
        !item.name
      ) {

        return false;

      }

      const quantity =
        Number(item.quantity);

      if (
        !Number.isFinite(quantity) ||
        quantity < 1
      ) {

        return false;

      }

    }

    return true;

  }


  /* =======================================================
     ORDER NUMBER
     ======================================================= */

  function generateOrderNumber() {

    const now =
      new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");

    const random =
      Math.floor(
        1000 +
        Math.random() * 9000
      );

    return (
      `CG-${year}${month}${day}-${random}`
    );

  }


  /* =======================================================
     BUILD ORDER ITEMS
     ======================================================= */

  function buildOrderItems(
    cart,
    orderId
  ) {

    return cart.map(
      function (item) {

        const quantity =
          Math.max(
            1,
            Number(item.quantity) || 1
          );

        const unitPrice =
          getItemPrice(item);

        return {

          order_id:
            orderId,

          product_id:
            item.productId ||
            item.id ||
            null,

          product_name:
            item.name ||
            "สินค้า",

          product_image:
            item.image ||
            null,

          category:
            item.category ||
            null,

          quantity:
            quantity,

          selected_option:
            item.selectedOption ||
            null,

          price_label:
            item.priceLabel ||
            (
              unitPrice
                ? formatMoney(unitPrice)
                : null
            ),

          unit_price:
            unitPrice,

          line_total:
            unitPrice *
            quantity

        };

      }
    );

  }


  /* =======================================================
     SUPABASE ERROR MESSAGE
     ======================================================= */

  function getSupabaseErrorMessage(
    error
  ) {

    if (!error) {
      return "ไม่ทราบสาเหตุ";
    }

    const message =
      error.message ||
      "";

    const lower =
      message.toLowerCase();


    if (
      lower.includes(
        "invalid api key"
      )
    ) {

      return (
        "Invalid API key — Publishable Key ที่หน้าเว็บใช้อยู่ไม่ถูกต้องหรือไม่ตรงกับ Project นี้"
      );

    }


    if (
      lower.includes(
        "permission denied"
      ) ||
      lower.includes(
        "row-level security"
      ) ||
      lower.includes(
        "42501"
      )
    ) {

      return (
        "Supabase ปฏิเสธสิทธิ์การบันทึกข้อมูล กรุณาตรวจสอบ RLS / Policy ของ orders และ order_items"
      );

    }


    if (
      lower.includes(
        "relation"
      ) &&
      lower.includes(
        "does not exist"
      )
    ) {

      return (
        "ไม่พบตารางใน Supabase กรุณาตรวจสอบชื่อ orders และ order_items"
      );

    }


    return message ||
      "เกิดข้อผิดพลาดจาก Supabase";

  }


  /* =======================================================
     SUBMIT
     ======================================================= */

  checkoutForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      if (
        submitOrderBtn.disabled
      ) {

        return;

      }


      const cart =
        getCart();


      /* ---------------------------------------------------
         CART
         --------------------------------------------------- */

      if (
        !validateCart(cart)
      ) {

        showToast(
          "ไม่พบรายการสินค้า กรุณากลับไปเลือกสินค้าอีกครั้ง",
          "error"
        );

        return;

      }


      /* ---------------------------------------------------
         CUSTOMER
         --------------------------------------------------- */

      const customerName =
        document
          .getElementById(
            "customerName"
          )
          .value
          .trim();

      const customerPhone =
        document
          .getElementById(
            "customerPhone"
          )
          .value
          .trim();

      const customerEmail =
        document
          .getElementById(
            "customerEmail"
          )
          .value
          .trim();

      const customerProvince =
        document
          .getElementById(
            "customerProvince"
          )
          .value
          .trim();

      const customerAddress =
        document
          .getElementById(
            "customerAddress"
          )
          .value
          .trim();

      const customerNote =
        document
          .getElementById(
            "customerNote"
          )
          .value
          .trim();


      const paymentInput =
        document.querySelector(
          'input[name="paymentMethod"]:checked'
        );

      const paymentMethod =
        paymentInput
          ? paymentInput.value
          : "bank_transfer";


      /* ---------------------------------------------------
         REQUIRED
         --------------------------------------------------- */

      if (
        !customerName ||
        !customerPhone ||
        !customerProvince ||
        !customerAddress
      ) {

        showToast(
          "กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน",
          "error"
        );

        return;

      }


      /* ---------------------------------------------------
         TOTAL
         --------------------------------------------------- */

      const subtotal =
        cart.reduce(
          function (sum, item) {

            return (
              sum +
              getItemTotal(item)
            );

          },
          0
        );

      const shippingFee =
        0;

      const total =
        subtotal +
        shippingFee;


      /* ---------------------------------------------------
         ORDER NUMBER
         --------------------------------------------------- */

      const orderNumber =
        generateOrderNumber();


      /* ---------------------------------------------------
         DISABLE BUTTON
         --------------------------------------------------- */

      submitOrderBtn.disabled =
        true;

      submitText.textContent =
        "กำลังบันทึกคำสั่งซื้อ...";


      try {

        /* =================================================
           STEP 1
           CREATE ORDER

           ไม่มี products test แล้ว
           ================================================= */

        const orderData = {

          order_number:
            orderNumber,

          customer_name:
            customerName,

          customer_phone:
            customerPhone,

          customer_email:
            customerEmail ||
            null,

          customer_province:
            customerProvince,

          customer_address:
            customerAddress,

          customer_note:
            customerNote ||
            null,

          payment_method:
            paymentMethod,

          subtotal:
            subtotal,

          shipping_fee:
            shippingFee,

          total:
            total,

          status:
            "pending",

          slip_path:
            null

        };


        console.log(
          "กำลังสร้าง Order:",
          orderNumber
        );


        const {
          data: createdOrder,
          error: orderError
        } =
          await supabaseClient
            .from("orders")
            .insert(
              orderData
            )
            .select(
              "id,order_number"
            )
            .single();


        if (orderError) {

          console.error(
            "ORDERS ERROR:",
            orderError
          );

          throw new Error(
            "บันทึกคำสั่งซื้อไม่สำเร็จ: " +
            getSupabaseErrorMessage(
              orderError
            )
          );

        }


        if (
          !createdOrder ||
          !createdOrder.id
        ) {

          throw new Error(
            "Supabase ไม่ส่ง Order ID กลับมา"
          );

        }


        console.log(
          "สร้าง Order สำเร็จ:",
          createdOrder.order_number
        );


        /* =================================================
           STEP 2
           ORDER ITEMS
           ================================================= */

        const orderItems =
          buildOrderItems(
            cart,
            createdOrder.id
          );


        const {
          error: itemsError
        } =
          await supabaseClient
            .from("order_items")
            .insert(
              orderItems
            );


        if (itemsError) {

          console.error(
            "ORDER ITEMS ERROR:",
            itemsError
          );

          throw new Error(
            "สร้างรายการสินค้าไม่สำเร็จ: " +
            getSupabaseErrorMessage(
              itemsError
            ) +
            " | Order: " +
            createdOrder.order_number
          );

        }


        console.log(
          "Order Items สำเร็จ"
        );


        /* =================================================
           STEP 3
           CLEAR CART
           ================================================= */

        saveCart([]);

        updateCartBadge();


        /* =================================================
           STEP 4
           SUCCESS
           ================================================= */

        successOrderNumber.textContent =
          createdOrder.order_number;

        successModal.classList.add(
          "show"
        );


        checkoutForm.reset();


        /* -------------------------------------------------
           RESET PAYMENT
           ------------------------------------------------- */

        const defaultPayment =
          document.querySelector(
            'input[name="paymentMethod"][value="bank_transfer"]'
          );

        if (defaultPayment) {

          defaultPayment.checked =
            true;

        }


        document
          .querySelectorAll(
            ".payment-option"
          )
          .forEach(
            function (element) {

              element.classList.remove(
                "active"
              );

            }
          );


        const firstPayment =
          document.querySelector(
            '.payment-option[data-payment="bank_transfer"]'
          );

        if (firstPayment) {

          firstPayment.classList.add(
            "active"
          );

        }


        /* -------------------------------------------------
           HIDE CHECKOUT
           ------------------------------------------------- */

        checkoutLayout.style.display =
          "none";

        emptyCheckout.style.display =
          "none";


      } catch (error) {

        console.error(
          "CHECKOUT ERROR:",
          error
        );


        const message =
          error &&
          error.message
            ? error.message
            : "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";


        showToast(
          message,
          "error"
        );


        alert(
          "ไม่สามารถยืนยันคำสั่งซื้อได้\n\n" +
          message
        );


      } finally {

        submitOrderBtn.disabled =
          false;

        submitText.textContent =
          "ยืนยันคำสั่งซื้อ";

      }

    }
  );


  /* =======================================================
     INITIALIZE
     ======================================================= */

  updateCartBadge();

  renderCart();


  /* =======================================================
     DEBUG — ไม่แสดง API KEY
     ======================================================= */

  console.log(
    "======================================"
  );

  console.log(
    "CHATPETCH CHECKOUT"
  );

  console.log(
    "Supabase Client: READY"
  );

  console.log(
    "Project:",
    SUPABASE_URL
  );

  console.log(
    "Cart:",
    getCart()
  );

  console.log(
    "======================================"
  );

})();
</script>
